<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Japan 2027 · Nic &amp; Elly</title>
<meta name="description" content="Our trip planner.">
<meta name="theme-color" content="#FBF7F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15110E" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="mockbar" id="mockbar" role="status" hidden></div>

<header class="top" id="top">
  <div class="top-in">
    <a class="brand" href="#" id="brand" aria-label="Japan 2027 · Nic &amp; Elly — today">
      <span class="sun" aria-hidden="true"></span><span class="brand-t">Japan 2027 <span class="brand-s">· Nic &amp; Elly</span></span>
    </a>
    <nav class="views" aria-label="Views">
      <a href="#" data-view="day">Days</a>
      <a href="#bookings" data-view="bookings">Bookings</a>
      <a href="#watch" data-view="watch">Watch list</a>
      <a href="#prep" data-view="prep">Prep</a>
      <a href="#sources" data-view="sources">Sources</a>
    </nav>
    <div class="top-act">
      <button type="button" class="pill pill-diet" id="dietbtn" aria-haspopup="dialog" hidden>Elly’s diet</button>
      <button type="button" class="iconbtn" id="themebtn" aria-label="Theme: auto"><span aria-hidden="true">◐</span></button>
    </div>
  </div>
  <nav class="strip" id="strip" aria-label="Days"></nav>
</header>

<div class="layout">
  <aside class="rail" id="rail" aria-label="Trip days"></aside>
  <main id="main" tabindex="-1">
    <div class="now-m" id="now-m"></div>
    <div id="view" class="view" aria-live="polite"><p class="loading">Loading the plan…</p></div>
  </main>
  <aside class="side" id="side" aria-label="Now, weather and deadlines">
    <div id="now-d"></div>
    <div id="wx-d"></div>
    <div id="dl-d"></div>
  </aside>
</div>

<nav class="tabbar" id="tabbar" aria-label="Views">
  <a href="#" data-view="day"><span class="tb-i" aria-hidden="true">◉</span>Day</a>
  <a href="#bookings" data-view="bookings"><span class="tb-i" aria-hidden="true">✓</span>Bookings</a>
  <a href="#watch" data-view="watch"><span class="tb-i" aria-hidden="true">◎</span>Watch</a>
  <a href="#prep" data-view="prep"><span class="tb-i" aria-hidden="true">☰</span>Prep</a>
  <a href="#sources" data-view="sources"><span class="tb-i" aria-hidden="true">↗</span>Sources</a>
</nav>

<dialog class="sheet" id="dietsheet" aria-labelledby="diet-h">
  <div class="sheet-in">
    <div class="sheet-h"><h2 id="diet-h">Elly’s diet</h2><button type="button" class="iconbtn" data-close aria-label="Close">✕</button></div>
    <div id="diet-b"></div>
  </div>
</dialog>

<div class="gate" id="gate" hidden>
  <form class="gate-f" id="gate-f">
    <span class="sun big" aria-hidden="true"></span>
    <h1>Japan 2027</h1>
    <label for="gate-i">Passcode</label>
    <input id="gate-i" type="password" autocomplete="current-password" required>
    <button type="submit" class="btn">Open</button>
    <p class="gate-e" id="gate-e" role="alert"></p>
  </form>
</div>

<noscript><p class="noscript">This trip plan needs JavaScript.</p></noscript>
<script src="js/config.js"></script>
<script type="module" src="js/live.js"></script>
<script src="js/app.js" defer></script>
</body>
</html>
